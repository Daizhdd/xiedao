name: Build macOS test packages

on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - '**.spec'
      - 'requirements*.txt'
      - 'assets/**'
      - 'docs/MACOS.md'
      - '.github/workflows/macos.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      RUN_LIVE_API_TEST: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Offline regression tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -q
          python test_smoke.py
      - name: Build and verify native app
        run: python scripts/build_macos.py --arch '${{ matrix.arch }}'
      - name: Upload verified download packages
        uses: actions/upload-artifact@v4
        with:
          name: xiedao-macos-${{ matrix.arch }}
          path: release-macos/*
          if-no-files-found: error
      - name: Preserve verification screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-verification-${{ matrix.arch }}
          path: build/verification-${{ matrix.arch }}/*
          if-no-files-found: ignore
